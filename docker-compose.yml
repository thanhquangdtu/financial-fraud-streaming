# Kafka (single node, KRaft, no ZooKeeper) for local development.
# Host apps connect to localhost:9092; containers connect to kafka:19092.
services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: fraud-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # One-shot job: creates the topic, then exits.
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: fraud-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    command: >
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092
      --create --if-not-exists --topic transactions.raw
      --partitions 3 --replication-factor 1
      --config retention.ms=604800000

  # Spark Structured Streaming (Week 3): starts with `docker compose up -d` and runs the live job.
  # Watch results: docker compose logs -f spark
  # Verify against batch: docker compose run --rm spark /workspace/src/financial_streaming/streaming/job.py --check
  spark:
    image: apache/spark:3.5.3-python3
    container_name: fraud-spark
    user: "0:0"
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    working_dir: /workspace
    volumes:
      - .:/workspace
      - spark-ivy:/tmp/.ivy
    entrypoint:
      - /opt/spark/bin/spark-submit
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3
      - --conf
      - spark.jars.ivy=/tmp/.ivy
    command: ["/workspace/src/financial_streaming/streaming/job.py"]

volumes:
  kafka-data:
  spark-ivy:

